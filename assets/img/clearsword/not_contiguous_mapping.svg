<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Diagram of a non-contiguous virtual to physical memory mapping</title>
  <desc>Virtual address 0x102b24000 maps to physical address 0x83b1c0000. Virtual address 0x102b28000 maps to physical address 0x86b7d8000. The two physical addresses are far apart and not contiguous.</desc>

  <style>
    .label       { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; fill: rgb(11, 11, 11); }
    .addr        { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 500; fill: rgb(68, 68, 65); }
    .addr-err    { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 500; fill: rgb(121, 31, 31); }
    .dots        { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 14px; font-weight: 400; fill: rgb(11, 11, 11); }
    .note        { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: rgb(82, 81, 78); }
    .box         { fill: rgb(241, 239, 232); stroke: rgb(95, 94, 90); stroke-width: 0.5px; }
    .box-err     { fill: rgb(252, 235, 235); stroke: rgb(163, 45, 45); stroke-width: 0.5px; }
    .arrow       { stroke: rgb(82, 81, 78); fill: none; }
    .arrow-err   { stroke: rgb(226, 75, 74); fill: none; }
    .brace       { stroke: rgb(82, 81, 78); fill: none; stroke-width: 1px; }

    @media (prefers-color-scheme: dark) {
      .label       { fill: rgb(210, 210, 208); }
      .addr        { fill: rgb(180, 180, 178); }
      .addr-err    { fill: rgb(255, 120, 120); }
      .dots        { fill: rgb(210, 210, 208); }
      .note        { fill: rgb(160, 160, 155); }
      .box         { fill: rgb(40, 40, 46); stroke: rgb(120, 120, 115); }
      .box-err     { fill: rgb(60, 30, 30); stroke: rgb(200, 70, 70); }
      .arrow       { stroke: rgb(160, 160, 155); }
      .arrow-err   { stroke: rgb(255, 100, 100); }
      .brace       { stroke: rgb(160, 160, 155); }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- Labels -->
  <text x="44" y="82" dominant-baseline="central" class="label">VA</text>
  <text x="44" y="222" dominant-baseline="central" class="label">PA</text>

  <!-- Arrows -->
  <line x1="240" y1="104" x2="240" y2="196" stroke-width="1.5" marker-end="url(#arrow)" class="arrow"/>
  <line x1="440" y1="104" x2="440" y2="196" stroke-width="1.5" marker-end="url(#arrow)" class="arrow-err"/>

  <!-- VA boxes -->
  <g>
    <rect x="177.5" y="60" width="125" height="44" rx="8" class="box"/>
    <text x="240" y="82" text-anchor="middle" dominant-baseline="central" class="addr">0x102b24000</text>
  </g>
  <g>
    <rect x="377.5" y="60" width="125" height="44" rx="8" class="box"/>
    <text x="440" y="82" text-anchor="middle" dominant-baseline="central" class="addr">0x102b28000</text>
  </g>

  <!-- PA boxes -->
  <g>
    <rect x="177.5" y="200" width="125" height="44" rx="8" class="box"/>
    <text x="240" y="222" text-anchor="middle" dominant-baseline="central" class="addr">0x83b1c0000</text>
  </g>
  <text x="340" y="222" text-anchor="middle" dominant-baseline="central" class="dots">...</text>
  <g>
    <rect x="377.5" y="200" width="125" height="44" rx="8" class="box-err"/>
    <text x="440" y="222" text-anchor="middle" dominant-baseline="central" class="addr-err">0x86b7d8000</text>
  </g>

  <!-- Not contiguous brace -->
  <path d="M177.5 244 V270 H502.5 V244" class="brace"/>
  <text x="340" y="290" text-anchor="middle" dominant-baseline="central" class="note">NOT contiguous</text>
</svg>