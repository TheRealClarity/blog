<svg width="100%" viewBox="0 0 1250 290" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Animated diagram of scanning adjacent physical memory next to mapping pages</title>
  <desc>A virtual mapping labeled "Search mapping" backed by five physical pages. A slider cycles through each page, revealing the immediately adjacent physical page at address plus 0x4000. In most cases that neighbour is foreign memory, shown in red. In one case the neighbour is already another page of the mapping, so no red page appears.</desc>

  <style>
    .label     { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; fill: rgb(68, 68, 65); }
    .addr      { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 500; fill: rgb(68, 68, 65); }
    .addr-err  { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 500; fill: rgb(121, 31, 31); }
    .box       { fill: rgb(241, 239, 232); stroke: rgb(95, 94, 90); stroke-width: 0.5px; }
    .box-err   { fill: rgb(252, 235, 235); stroke: rgb(163, 45, 45); stroke-width: 0.5px; }
    .arrow     { stroke: rgb(82, 81, 78); fill: none; }
    .dot       { fill: rgb(82, 81, 78); }

    @media (prefers-color-scheme: dark) {
      .label     { fill: rgb(180, 180, 178); }
      .addr      { fill: rgb(180, 180, 178); }
      .addr-err  { fill: rgb(255, 120, 120); }
      .box       { fill: rgb(40, 40, 46); stroke: rgb(120, 120, 115); }
      .box-err   { fill: rgb(60, 30, 30); stroke: rgb(200, 70, 70); }
      .arrow     { stroke: rgb(160, 160, 155); }
      .dot       { fill: rgb(160, 160, 155); }
    }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Search mapping bar -->
  <rect x="40" y="60" width="1168" height="50" rx="25" class="box"/>
  <text x="624" y="85" text-anchor="middle" dominant-baseline="central" class="label">Search mapping</text>

  <!-- Dots -->
  <circle cx="96"   cy="110" r="3" class="dot"/>
  <circle cx="360"  cy="110" r="3" class="dot"/>
  <circle cx="624"  cy="110" r="3" class="dot"/>
  <circle cx="736"  cy="110" r="3" class="dot"/>
  <circle cx="1000" cy="110" r="3" class="dot"/>

  <!-- Arrows -->
  <line x1="96"   y1="110" x2="96"   y2="186" stroke-width="1.2" marker-end="url(#arr)" class="arrow"/>
  <line x1="360"  y1="110" x2="360"  y2="186" stroke-width="1.2" marker-end="url(#arr)" class="arrow"/>
  <line x1="624"  y1="110" x2="624"  y2="186" stroke-width="1.2" marker-end="url(#arr)" class="arrow"/>
  <line x1="736"  y1="110" x2="736"  y2="186" stroke-width="1.2" marker-end="url(#arr)" class="arrow"/>
  <line x1="1000" y1="110" x2="1000" y2="186" stroke-width="1.2" marker-end="url(#arr)" class="arrow"/>

  <!-- Physical page boxes (always visible) -->
  <g><rect x="40"  y="190" width="112" height="44" rx="8" class="box"/><text x="96"   y="212" text-anchor="middle" dominant-baseline="central" class="addr">0x86b7d4000</text></g>
  <g><rect x="304" y="190" width="112" height="44" rx="8" class="box"/><text x="360"  y="212" text-anchor="middle" dominant-baseline="central" class="addr">0x86c214000</text></g>
  <g><rect x="568" y="190" width="112" height="44" rx="8" class="box"/><text x="624"  y="212" text-anchor="middle" dominant-baseline="central" class="addr">0x86a9dc000</text></g>
  <g><rect x="680" y="190" width="112" height="44" rx="8" class="box"/><text x="736"  y="212" text-anchor="middle" dominant-baseline="central" class="addr">0x86a9e0000</text></g>
  <g><rect x="944" y="190" width="112" height="44" rx="8" class="box"/><text x="1000" y="212" text-anchor="middle" dominant-baseline="central" class="addr">0x86f0a8000</text></g>

  <!--
    Slider pill: 10s total cycle, 2s per page.
    Width 224 = two 112px boxes side by side (page box + its OOB neighbour).
    x aligns to the LEFT edge of each page box:
      page1=40  page2=304  page3=568  page4=680  page5=944
    keyTimes: 0, 0.2, 0.4, 0.6, 0.8  (one per page start)
  -->
  <rect y="248" width="224" height="16" rx="8" fill="#8B5CF6" opacity="0.35">
    <animate attributeName="x"
             dur="8s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;  0.2; 0.4; 0.6; 0.8"
             values=  "40; 304; 568; 680; 944"/>
  </rect>

  <!--
    OOB neighbour boxes fade in ~0.1s after slider arrives, fade out ~0.15s before it leaves.
    10s cycle, 2s per page:
      page1 slot 0-2s:   show 0.1-1.85s  → keyTimes 0.010-0.185
      page2 slot 2-4s:   show 2.1-3.85s  → keyTimes 0.210-0.385
      page4 slot 6-8s:   show 6.1-7.85s  → keyTimes 0.610-0.785
      page5 slot 8-10s:  show 8.1-9.85s  → keyTimes 0.810-0.985
    page3 neighbour is page4 (already in mapping) — no OOB box.
  -->

  <!-- OOB page 1 neighbour: 0x86b7d8000, x=152 -->
  <g>
    <rect x="152" y="190" width="112" height="44" rx="8" class="box-err">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0; 0.010; 0.185; 0.2; 1"
               values=  "0; 1;     1;     0;   0"/>
    </rect>
    <text x="208" y="212" text-anchor="middle" dominant-baseline="central" class="addr-err">0x86b7d8000
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0; 0.010; 0.185; 0.2; 1"
               values=  "0; 1;     1;     0;   0"/>
    </text>
  </g>

  <!-- OOB page 2 neighbour: 0x86c218000, x=416 -->
  <g>
    <rect x="416" y="190" width="112" height="44" rx="8" class="box-err">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0; 0.2; 0.210; 0.385; 0.4; 1"
               values=  "0; 0;  1;     1;     0;   0"/>
    </rect>
    <text x="472" y="212" text-anchor="middle" dominant-baseline="central" class="addr-err">0x86c218000
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0; 0.2; 0.210; 0.385; 0.4; 1"
               values=  "0; 0;  1;     1;     0;   0"/>
    </text>
  </g>

  <!-- page3 neighbour = page4 (in mapping already): no OOB box -->

  <!-- OOB page 4 neighbour: 0x86a9e4000, x=792 -->
  <g>
    <rect x="792" y="190" width="112" height="44" rx="8" class="box-err">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0; 0.6; 0.610; 0.785; 0.8; 1"
               values=  "0; 0;  1;     1;     0;   0"/>
    </rect>
    <text x="848" y="212" text-anchor="middle" dominant-baseline="central" class="addr-err">0x86a9e4000
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0; 0.6; 0.610; 0.785; 0.8; 1"
               values=  "0; 0;  1;     1;     0;   0"/>
    </text>
  </g>

  <!-- OOB page 5 neighbour: 0x86f0ac000, x=1056 -->
  <g>
    <rect x="1056" y="190" width="112" height="44" rx="8" class="box-err">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0; 0.8; 0.810; 0.985; 1"
               values=  "0; 0;  1;     1;     0"/>
    </rect>
    <text x="1112" y="212" text-anchor="middle" dominant-baseline="central" class="addr-err">0x86f0ac000
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0; 0.8; 0.810; 0.985; 1"
               values=  "0; 0;  1;     1;     0"/>
    </text>
  </g>

</svg>
