<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Diagram of a virtual memory mapping bug with real addresses</title>
  <desc>Virtual address 0x102b24000 correctly maps straight down to physical address 0x83b1c0000. Virtual address 0x102b28000 should map to physical address 0x86b7d8000, but due to a bug it instead maps straight down to 0x83b1c4000.</desc>

  <style>
    .label       { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; fill: rgb(11, 11, 11); }
    .addr        { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 500; fill: rgb(68, 68, 65); }
    .addr-err    { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 500; fill: rgb(121, 31, 31); }
    .dots        { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 14px; font-weight: 400; fill: rgb(11, 11, 11); }
    .box         { fill: rgb(241, 239, 232); stroke: rgb(95, 94, 90); stroke-width: 0.5px; }
    .box-err     { fill: rgb(252, 235, 235); stroke: rgb(163, 45, 45); stroke-width: 0.5px; }
    .arrow       { stroke: rgb(82, 81, 78); fill: none; }
    .arrow-err   { stroke: rgb(226, 75, 74); fill: none; }
    .arrow-dash  { stroke: rgb(82, 81, 78); fill: none; opacity: 0.6; }

    @media (prefers-color-scheme: dark) {
      .label       { fill: rgb(210, 210, 208); }
      .addr        { fill: rgb(180, 180, 178); }
      .addr-err    { fill: rgb(255, 120, 120); }
      .dots        { fill: rgb(210, 210, 208); }
      .box         { fill: rgb(40, 40, 46); stroke: rgb(120, 120, 115); }
      .box-err     { fill: rgb(60, 30, 30); stroke: rgb(200, 70, 70); }
      .arrow       { stroke: rgb(160, 160, 155); }
      .arrow-err   { stroke: rgb(255, 100, 100); }
      .arrow-dash  { stroke: rgb(160, 160, 155); opacity: 0.6; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- Labels -->
  <text x="44" y="82" dominant-baseline="central" class="label">VA</text>
  <text x="44" y="242" dominant-baseline="central" class="label">PA</text>

  <!-- Arrows -->
  <line x1="130" y1="104" x2="130" y2="216" stroke-width="1.5" marker-end="url(#arrow)" class="arrow"/>
  <line x1="275" y1="104" x2="275" y2="216" stroke-width="1.5" marker-end="url(#arrow)" class="arrow-err"/>
  <line x1="275" y1="104" x2="570" y2="216" stroke-width="1.2" stroke-dasharray="5 5" marker-end="url(#arrow)" class="arrow-dash"/>

  <!-- VA boxes -->
  <g>
    <rect x="67.5" y="60" width="125" height="44" rx="8" class="box"/>
    <text x="130" y="82" text-anchor="middle" dominant-baseline="central" class="addr">0x102b24000</text>
  </g>
  <g>
    <rect x="212.5" y="60" width="125" height="44" rx="8" class="box"/>
    <text x="275" y="82" text-anchor="middle" dominant-baseline="central" class="addr">0x102b28000</text>
  </g>

  <!-- PA boxes -->
  <g>
    <rect x="70" y="220" width="120" height="44" rx="8" class="box"/>
    <text x="130" y="242" text-anchor="middle" dominant-baseline="central" class="addr">0x83b1c0000</text>
  </g>
  <g>
    <rect x="215" y="220" width="120" height="44" rx="8" class="box-err"/>
    <text x="275" y="242" text-anchor="middle" dominant-baseline="central" class="addr-err">0x83b1c4000</text>
  </g>
  <text x="355" y="242" text-anchor="middle" dominant-baseline="central" class="dots">...</text>
  <g>
    <rect x="375" y="220" width="120" height="44" rx="8" class="box"/>
    <text x="435" y="242" text-anchor="middle" dominant-baseline="central" class="addr">0x86b7d4000</text>
  </g>
  <g>
    <rect x="510" y="220" width="120" height="44" rx="8" class="box"/>
    <text x="570" y="242" text-anchor="middle" dominant-baseline="central" class="addr">0x86b7d8000</text>
  </g>
</svg>